name: s2562-hw09-cache
services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  redis-data:
