<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Login - Transit Incident Portal</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">
        Transit Incident Portal
      </a>

      <a class="btn btn-outline-light" href="/">
        Home
      </a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow">
          <div class="card-body p-4">
            <h1 class="h3 mb-3">Account Login</h1>

            <p class="text-secondary">
              Sign in to access the protected transit
              incident dashboard.
            </p>

            {% if error %}
              <div
                class="alert alert-danger"
                role="alert"
              >
                {{ error }}
              </div>
            {% endif %}

            {% if expired %}
              <div
                class="alert alert-warning"
                role="alert"
              >
                Your session expired due to inactivity.
                Please log in again.
              </div>
            {% endif %}

            <form method="post" action="/login">
              <div class="mb-3">
                <label
                  class="form-label"
                  for="username"
                >
                  Username
                </label>

                <input
                  class="form-control"
                  id="username"
                  name="username"
                  type="text"
                  autocomplete="username"
                  required
                >
              </div>

              <div class="mb-3">
                <label
                  class="form-label"
                  for="password"
                >
                  Password
                </label>

                <input
                  class="form-control"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                >
              </div>

              <button
                class="btn btn-primary w-100"
                type="submit"
              >
                Login
              </button>
            </form>

            <div class="alert alert-secondary mt-4 mb-0">
              Demonstration credentials:
              <strong>admin / password</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
