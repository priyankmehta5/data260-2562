<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW1 - Priyank Mehta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>HW1 - Priyank Mehta</h1>
            <p>Municipal Transit Incident Manager</p>
        </div>
    </header>

    <main>
        <section class="panel">
            <h2>Report a Transit Incident</h2>

            <form id="incidentForm">
                <div class="form-group">
                    <label for="title">Incident title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        maxlength="100"
                        placeholder="Enter the incident title"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Incident description</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        maxlength="500"
                        placeholder="Describe the transit incident"
                        required
                    ></textarea>
                </div>

                <button type="submit">Add Incident</button>
            </form>

            <p id="formMessage" class="message" hidden></p>
        </section>

        <section class="panel">
            <div class="section-heading">
                <h2>Transit Incidents</h2>

                <button
                    id="refreshButton"
                    class="secondary-button"
                    type="button"
                >
                    Refresh
                </button>
            </div>

            <form id="searchForm" class="search-form">
                <label for="search">Search incidents</label>

                <div class="search-controls">
                    <input
                        type="search"
                        id="search"
                        name="search"
                        placeholder="Search title or description"
                    >

                    <button type="submit">Search</button>

                    <button
                        id="clearSearchButton"
                        class="secondary-button"
                        type="button"
                    >
                        Clear
                    </button>
                </div>
            </form>

            <div
                id="loadingState"
                class="status-state"
                role="status"
            >
                Loading incidents...
            </div>

            <div
                id="emptyState"
                class="status-state"
                hidden
            >
                No transit incidents were found.
            </div>

            <div
                id="errorState"
                class="status-state error-state"
                role="alert"
                hidden
            >
                Unable to load incidents. Please try again.
            </div>

            <div
                id="incidentList"
                class="incident-list"
                hidden
            ></div>
        </section>
    </main>

    <footer>
        <p>DATA 260 | SJSU ID: 019152562</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
