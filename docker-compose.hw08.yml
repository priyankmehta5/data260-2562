name: s2562-hw08
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile.hw08
  environment: &environment
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    HW08_EVENT_DIR: /app/reports/hw08/raw
    HW08_DEDUP_DB: /app/reports/hw08/raw/state/pipeline.sqlite3
    OLLAMA_HOST: http://host.docker.internal:11434
  volumes:
    - ./reports/hw08:/app/reports/hw08
    - ./reports/hw09:/app/reports/hw09
  depends_on:
    topics:
      condition: service_completed_successfully
services:
  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 30s
  topics:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in s2562_entity_requests s2562_entity_responses s2562_inbox s2562_drafts s2562_final s2562_dead_letter; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic s2562_tasks --partitions 2 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe
  worker:
    <<: *app
    command: ["python", "-m", "backend.hw08_worker"]
  api:
    <<: *app
    environment:
      <<: *environment
      HW08_KAFKA_ENABLED: "1"
      HW08_SKIP_LEGACY_DB: "1"
    ports:
      - "127.0.0.1:8762:8762"
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8762"]
  planner:
    <<: *app
    command: ["python", "planner.py"]
  writer:
    <<: *app
    command: ["python", "writer.py", "--instance", "writer-1"]
  reviewer:
    <<: *app
    command: ["python", "reviewer.py"]
volumes:
  kafka-data:
